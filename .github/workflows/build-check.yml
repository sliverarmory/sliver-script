name: Build Check

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit the complete locked toolchain
        run: npm run audit:all

      - name: Audit the published dependency graph
        run: npm run audit:production

  package-check:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify publication ordering policy
        run: npm run publish-order:check

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:dry-run

      - name: Verify packed CJS, ESM, and NodeNext consumers
        run: npm run pack:check

  protobuf-check:
    name: protobuf provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and pinned Sliver input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up exact protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source, toolchain, descriptor, and generated bytes
        run: npm run protobuf:check

  e2e-tests:
    name: Sliver e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source and pinned Sliver input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache: false

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run isolated Sliver E2E matrix
        run: npm run test:e2e

  direct-mtls-smoke:
    name: direct mTLS large-artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and pinned Sliver input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache: false

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run direct mTLS large-artifact control
        run: npm run test:e2e
        env:
          SLIVER_E2E_TEST_PATTERN: 00-operator
