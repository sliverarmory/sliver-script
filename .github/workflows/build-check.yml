name: Build Check

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source commit selected by the release workflow
        type: string
        default: ""
      release-artifact:
        description: Retain the checked Linux tarball for npm publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit the complete locked toolchain
        run: npm run audit:all

      - name: Audit the production dependency graph
        run: npm run audit:production

  package-check:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Test npm release validation
        shell: bash
        run: node --test scripts/npm-release/*.test.mjs

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm run pack:dry-run

      - name: Verify packed CJS, ESM, and NodeNext consumers
        shell: bash
        env:
          RETAIN_RELEASE: ${{ inputs.release-artifact && matrix.os == 'ubuntu-latest' }}
        run: |
          if [[ "$RETAIN_RELEASE" == "true" ]]; then
            npm run pack:check -- --output-dir "$RUNNER_TEMP/npm-release"
          else
            npm run pack:check
          fi

      - name: Upload the validated release tarball
        if: ${{ inputs.release-artifact && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          # A full rerun replaces this artifact only after consumer checks pass.
          overwrite: true
          retention-days: 14

  protobuf-check:
    name: protobuf provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and pinned Sliver input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
          submodules: recursive

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up exact protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Verify exact bundled npm
        shell: bash
        run: |
          actual="$(npm --version)"
          if [[ "$actual" != "11.19.0" ]]; then
            echo "::error title=Wrong bundled npm::Node.js 24.20.0 must provide npm 11.19.0 (found ${actual})."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source, toolchain, descriptor, and generated bytes
        run: npm run protobuf:check
